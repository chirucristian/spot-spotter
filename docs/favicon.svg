<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="spotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#2563EB" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Squircle rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Viewfinder / Spotter Reticle Brackets -->
  <path d="M 18 25 L 18 20 C 18 17 20 15 23 15 L 28 15" fill="none" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 36 15 L 41 15 C 44 15 46 17 46 20 L 46 25" fill="none" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 46 39 L 46 44 C 46 47 44 49 41 49 L 36 49" fill="none" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 28 49 L 23 49 C 20 49 18 47 18 44 L 18 39" fill="none" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Pinpoint Pulse Halo & Target Core -->
  <circle cx="32" cy="32" r="9" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.5" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="5.5" fill="url(#spotGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2.2" fill="#FFFFFF"/>
</svg>
